[supervisord]
nodaemon=true
logfile=/app/data/logs/supervisord.log
pidfile=/var/run/supervisord.pid

[program:vpn-log-scheduler]
command=/usr/local/bin/python3 /scripts/vpn_log_scheduler.py
directory=/app/src
autostart=true
autorestart=true
stdout_logfile=/app/data/logs/vpn_scheduler.log
stderr_logfile=/app/data/logs/vpn_scheduler_error.log

[program:gunicorn]
command=gunicorn --workers 4 --timeout 180 --bind 0.0.0.0:5000 --access-logfile - --error-logfile - --log-level info app:app
directory=/app/src
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
